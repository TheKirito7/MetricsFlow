# Only for the loopback-bound production topology in docker-compose.production.yml.
# The host TLS terminator must REPLACE X-Forwarded-For with the client address.
set_real_ip_from 172.30.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive off;
if ($http_x_forwarded_proto = https) {
    set $external_scheme https;
}
