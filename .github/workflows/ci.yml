name: MetricsFlow CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metricsflow_test
          POSTGRES_USER: metricsflow
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U metricsflow -d metricsflow_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://metricsflow:ci-only-password@127.0.0.1:5432/metricsflow_test
      TEST_DATABASE_URL: postgresql+psycopg://metricsflow:ci-only-password@127.0.0.1:5432/metricsflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy --config-file backend/pyproject.toml
      - run: alembic -c backend/alembic.ini upgrade head
      - run: alembic -c backend/alembic.ini check
      - run: pytest backend/tests -q --cov=app --cov-config=backend/pyproject.toml --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metricsflow_e2e
          POSTGRES_USER: metricsflow
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U metricsflow -d metricsflow_e2e" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+psycopg://metricsflow:ci-only-password@127.0.0.1:5432/metricsflow_e2e
      DEMO_PASSWORD: ci-only-demo-password
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-results
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
  portfolio:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: metricsflow_portfolio
          POSTGRES_USER: metricsflow
          POSTGRES_PASSWORD: ci-only-password
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U metricsflow -d metricsflow_portfolio" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PORTFOLIO_DATABASE_URL: postgresql+psycopg://metricsflow:ci-only-password@127.0.0.1:5432/metricsflow_portfolio
      DEMO_PASSWORD: ci-only-demo-password
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.lock
      - run: python -m pip install --no-deps -e backend
      - run: npx playwright install --with-deps chromium
      - run: npm run portfolio
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: clean-portfolio-media
          path: |
            docs/screenshots/
            docs/demo/
            test-results/portfolio/
