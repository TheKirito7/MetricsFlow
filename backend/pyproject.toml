[project]
name = "metricsflow-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.16.1,<3",
  "email-validator>=2.2,<3", "argon2-cffi>=23.1,<26", "tzdata>=2025.1"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2.16,<3", "ruff>=0.11,<1", "pytest-cov>=7,<8", "mypy>=2.4,<3", "types-PyYAML"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL and TEST_DATABASE_URL"]
[tool.coverage.run]
source = ["app"]
branch = true
[tool.coverage.report]
fail_under = 80
show_missing = true
[tool.mypy]
python_version = "3.14"
files = ["backend/app"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
